name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-armeabi-v7a
          path: app/build/outputs/apk/default/debug/app-default-armeabi-v7a-debug.apk
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-v8a
          path: app/build/outputs/apk/default/debug/app-default-arm64-v8a-debug.apk
          archive: false

      - name: Sign release APKs
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing KEY_ALIAS secret"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          [ -n "$APKSIGNER" ] || { echo "apksigner not found"; exit 1; }
          mkdir -p signed
          mapfile -t UNSIGNED < <(find app/build/outputs/apk -name '*-release-unsigned.apk')
          [ "${#UNSIGNED[@]}" -gt 0 ] || { echo "No release APKs found"; exit 1; }
          for apk in "${UNSIGNED[@]}"; do
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --out "signed/$(basename "${apk/-unsigned/}")" \
              "$apk"
          done
          rm -f "$KEYSTORE"

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t APKS < <(find signed -name '*-release.apk')
          [ "${#APKS[@]}" -gt 0 ] || { echo "No APKs found"; exit 1; }
          gh release create "build-${{ github.run_number }}" "${APKS[@]}" \
            --title "Build ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --generate-notes
